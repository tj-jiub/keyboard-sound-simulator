<!DOCTYPE html>
<html data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <title>키보드 소리 시뮬레이터 - 설정</title>
  <style>
    :root {
      --bg: #1c1c1e;
      --card-bg: color-mix(in srgb, var(--bg) 100%, white 9%);
      --titlebar-bg: color-mix(in srgb, var(--bg) 100%, white 15%);
      --text: #f5f5f7;
      --text-dim: #9a9aa0;
      --border: rgba(255, 255, 255, 0.1);
      --divider: rgba(255, 255, 255, 0.1);
      --slate: #7fb0d9;
      --orange: #e8944f;
      --font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'SF Pro Text', sans-serif;
    }
    :root[data-theme="light"] {
      --bg: #eceef1;
      --card-bg: color-mix(in srgb, var(--bg) 55%, white 45%);
      --titlebar-bg: color-mix(in srgb, var(--bg) 70%, white 30%);
      --text: #1d1d1f;
      --text-dim: #86868b;
      --border: rgba(0, 0, 0, 0.09);
      --divider: rgba(0, 0, 0, 0.07);
      --slate: #5c7d99;
      --orange: #c9793f;
    }
    * { box-sizing: border-box; }
    button, select { font-family: inherit; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-family);
      transition: background-color .25s ease, color .25s ease;
      -webkit-user-select: none;
      overflow-y: auto;
      scrollbar-gutter: stable;
    }
    .titlebar {
      display: flex;
      align-items: center;
      padding: 10px 12px;
      background: var(--titlebar-bg);
      border-bottom: 1px solid var(--divider);
      -webkit-app-region: drag;
    }
    .mascot-btn {
      position: relative;
      flex: none;
      display: flex;
      align-items: center;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }
    .titlebar .mascot {
      width: 26px;
      height: 18px;
      overflow: visible;
      color: var(--mascot-color, var(--slate));
      transition: color .25s ease;
    }
    .speech-bubble {
      position: absolute;
      left: 30px;
      top: 20px;
      z-index: 5;
      background: #fff;
      color: #1d1d1f;
      font-size: 9.5px;
      font-weight: 700;
      line-height: 1;
      padding: 4px 7px;
      border-radius: 8px;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, .3);
      animation: bubble-pulse 1.8s ease-in-out infinite;
      pointer-events: none;
    }
    .speech-bubble::after {
      content: '';
      position: absolute;
      left: -4px;
      top: 4px;
      border-width: 4px 5px 4px 0;
      border-style: solid;
      border-color: transparent #fff transparent transparent;
    }
    @keyframes bubble-pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.06); opacity: .85; }
    }
    .mascot .cat-body {
      transform-box: fill-box;
      transform-origin: 50% 100%;
      animation: cat-bob .6s ease-in-out infinite;
    }
    .mascot .cat-leg {
      transform-box: fill-box;
      transform-origin: 50% 0%;
    }
    .mascot .cat-leg-back { animation: cat-swing-a .6s ease-in-out infinite; }
    .mascot .cat-leg-front { animation: cat-swing-b .6s ease-in-out infinite; }
    @keyframes cat-bob {
      0%, 50%, 100% { transform: translateY(0); }
      25%, 75% { transform: translateY(-1px); }
    }
    @keyframes cat-swing-a {
      0%, 100% { transform: rotate(-18deg); }
      50% { transform: rotate(18deg); }
    }
    @keyframes cat-swing-b {
      0%, 100% { transform: rotate(18deg); }
      50% { transform: rotate(-18deg); }
    }
    .titlebar .title { flex: 1; text-align: center; font-size: 13px; font-weight: 600; margin-right: 27px; }

    .panel { padding: 16px; display: flex; flex-direction: column; gap: 14px; }
    .card {
      background: var(--card-bg);
      border-radius: 12px;
      box-shadow: 0 1px 0 rgba(0, 0, 0, .03) inset, 0 6px 18px rgba(0, 0, 0, .05);
      overflow: hidden;
    }

    /* 재생 카드 */
    .now-playing { padding: 13px 14px; }
    .now-playing .title { font-size: 14px; font-weight: 600; }
    .now-playing .caption { font-size: 12px; color: var(--text-dim); margin-top: 2px; }
    .hr { height: 1px; background: var(--divider); border: none; margin: 0; }
    .dropdown-wrap { position: relative; margin: 10px 12px; }
    .dropdown-trigger {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      border: 1px solid var(--border);
      border-radius: 9px;
      background: rgba(128, 128, 128, .09);
      padding: 9px 12px;
      font: inherit;
      font-size: 13px;
      color: inherit;
      cursor: pointer;
      transition: background-color .15s ease, border-color .15s ease;
    }
    .dropdown-trigger:hover { background-color: rgba(128, 128, 128, .16); }
    .dropdown-trigger span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .dropdown-trigger svg { flex: none; transition: transform .28s ease; }
    .dropdown-trigger.open svg { transform: rotate(180deg); }
    .dropdown-panel {
      position: fixed;
      z-index: 100;
      background: #f5f5f7;
      color: #1d1d1f;
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, .28);
      overflow: hidden;
      transform-origin: top;
      max-height: 0;
      opacity: 0;
      transform: translateY(-6px) scaleY(.98);
      pointer-events: none;
      transition: max-height .38s cubic-bezier(.22, 1, .36, 1), opacity .28s ease, transform .28s ease;
    }
    .dropdown-panel.open {
      max-height: 280px;
      opacity: 1;
      transform: translateY(0) scaleY(1);
      pointer-events: auto;
    }
    .dropdown-list { max-height: 230px; overflow-y: auto; padding: 6px; }
    .dropdown-group-header {
      font-size: 10.5px;
      font-weight: 600;
      letter-spacing: .04em;
      color: #9a9a9e;
      padding: 6px 8px 2px;
    }
    .dropdown-option {
      padding: 8px;
      border-radius: 7px;
      font-size: 13px;
      cursor: pointer;
      transition: background-color .12s ease;
    }
    .dropdown-option:hover { background-color: #e4e4e7; }
    .dropdown-option.selected { background: #e4e4e7; color: #3a3a3c; }
    .dropdown-option .fav-star { color: #c9793f; margin-right: 3px; }
    .dropdown-empty { padding: 10px 8px; font-size: 12.5px; color: #9a9a9e; }
    .action-bar { display: flex; }
    .action-bar button {
      flex: 1;
      border: 0;
      background: transparent;
      padding: 11px;
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      white-space: nowrap;
      transition: background-color .15s ease;
    }
    #random-btn { color: var(--slate); }
    #random-btn:hover { background-color: color-mix(in srgb, var(--slate) 14%, transparent); }
    #fav-btn { color: var(--orange); font-weight: 400; transition: background-color .15s ease, font-weight .15s ease; }
    #fav-btn:hover { background-color: color-mix(in srgb, var(--orange) 14%, transparent); }
    #fav-btn.active { font-weight: 700; }
    .action-divider { width: 1px; background: var(--divider); }

    /* 슬라이더 카드 */
    .sliders-card { padding: 14px; display: flex; flex-direction: column; gap: 14px; }
    .slider-row .slabel {
      display: flex;
      justify-content: space-between;
      font-size: 12.5px;
      margin-bottom: 7px;
    }
    .slider-row .slabel .val { color: var(--text-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .slider-row input[type="range"] {
      -webkit-appearance: none;
      width: 100%;
      height: 5px;
      border-radius: 99px;
      outline: none;
      accent-color: var(--slate);
    }
    .slider-row input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 15px;
      height: 15px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .4);
      cursor: pointer;
      margin-top: -5px;
    }

    /* 다크모드 카드 */
    .darkmode-card { padding: 13px 14px; display: flex; align-items: center; justify-content: space-between; }
    .darkmode-card .label { font-size: 13.5px; }
    .toggle { position: relative; display: inline-flex; width: 38px; height: 22px; cursor: pointer; }
    .toggle input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
    .toggle .track { position: absolute; inset: 0; border-radius: 999px; background: var(--divider); transition: background .15s ease; }
    .toggle input:checked ~ .track { background: var(--slate); }
    .toggle .thumb {
      position: absolute;
      top: 2px;
      left: 2px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #fff;
      transition: left .15s ease;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .3);
    }
    .toggle input:checked ~ .thumb { left: 17px; }

    /* 환경설정 카드 */
    .prefs-header {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 0;
      background: transparent;
      padding: 13px 14px;
      font: inherit;
      cursor: pointer;
      color: inherit;
    }
    .prefs-header span { font-size: 13.5px; }
    .prefs-header svg { transition: transform .25s ease; }
    .prefs-header.open svg { transform: rotate(180deg); }
    .prefs-content { overflow: hidden; max-height: 0; transition: max-height .3s ease; }
    .prefs-content.open { max-height: 260px; }
    .prefs-body { padding: 0 14px 14px; display: flex; flex-direction: column; gap: 12px; }
    .prefs-group-label { font-size: 12px; color: var(--text-dim); margin-bottom: 7px; }
    .swatch-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .swatch-circle {
      flex: none;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      border: none;
      box-shadow: 0 0 0 1px rgba(128, 128, 128, .3);
    }
    .swatch-circle.selected { box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--slate); }
    .swatch-custom {
      position: relative;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      cursor: pointer;
      background: conic-gradient(red, yellow, lime, cyan, blue, magenta, red);
      box-shadow: 0 0 0 1px rgba(128, 128, 128, .3);
      overflow: hidden;
      flex: none;
    }
    .swatch-custom input[type="color"] {
      position: absolute;
      inset: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      border: none;
      padding: 0;
      opacity: 0;
      cursor: pointer;
    }
    .font-pill {
      flex: none;
      white-space: nowrap;
      padding: 6px 11px;
      border-radius: 999px;
      font-size: 12px;
      cursor: pointer;
      background: transparent;
      color: inherit;
      border: 1px solid var(--border);
    }
    .font-pill.selected { background: var(--orange); color: #fff; border-color: var(--orange); }

    /* 광고 배너 */
    .ad-banner {
      width: 100%;
      border: 0;
      font: inherit;
      color: inherit;
      text-align: left;
      cursor: pointer;
      padding: 11px 14px;
      display: flex;
      align-items: center;
      gap: 9px;
      transition: filter .15s ease;
    }
    .ad-banner:hover { filter: brightness(1.06); }
    .ad-disclosure {
      text-align: center;
      font-size: 10px;
      color: var(--text-dim);
      opacity: .75;
      margin-top: -6px;
      padding: 0 10px;
    }
    .ad-badge {
      flex: none;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: .03em;
      color: var(--text-dim);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 1px 5px;
    }
    .ad-copy { flex: 1; font-size: 12.5px; }
    .ad-copy .ad-sub { display: block; font-size: 11px; color: var(--text-dim); margin-top: 1px; }
    .ad-cta { flex: none; font-size: 12px; font-weight: 600; color: var(--slate); }

    .credit-btn {
      all: unset;
      display: block;
      width: 100%;
      box-sizing: border-box;
      text-align: center;
      font-size: 10.5px;
      color: var(--text-dim);
      margin-top: 2px;
      cursor: pointer;
      padding: 4px;
    }
    .credit-btn:hover { color: var(--slate); }
    .error { color: #ff6b6b; font-size: 12px; text-align: center; padding: 0 14px; }

    /* 카카오페이 QR 모달 */
    .qr-modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s ease;
    }
    .qr-modal-overlay.open { opacity: 1; pointer-events: auto; }
    .qr-modal {
      background: #fff;
      border-radius: 16px;
      padding: 20px;
      width: 220px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0, 0, 0, .4);
    }
    .qr-modal img { width: 100%; border-radius: 8px; display: block; }
    .qr-modal .qr-caption { margin-top: 10px; font-size: 12.5px; color: #444; line-height: 1.4; }
    .qr-modal .qr-close {
      margin-top: 12px;
      border: 0;
      background: var(--slate);
      color: #fff;
      font-size: 12px;
      font-weight: 600;
      padding: 7px 16px;
      border-radius: 8px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="titlebar">
    <button id="mascot-btn" class="mascot-btn" title="응원하기">
      <svg class="mascot" viewBox="0 0 32 22" aria-hidden="true">
        <path class="cat-leg cat-leg-back" d="M9 15 L9 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        <path class="cat-leg cat-leg-front" d="M20 15 L20 21" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" />
        <g class="cat-body" fill="currentColor">
          <path d="M4 10 Q -2 5 1 1" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" />
          <ellipse cx="14" cy="11" rx="9" ry="6" />
          <circle cx="24" cy="6.5" r="5" />
          <polygon points="20.5,3 22,-1 24,3" />
          <polygon points="26,3 28.5,-1 29.5,3.5" />
        </g>
        <g class="cat-face">
          <circle cx="22.4" cy="5.8" r="0.7" fill="rgba(0,0,0,.65)" />
          <circle cx="25.6" cy="5.8" r="0.7" fill="rgba(0,0,0,.65)" />
          <path d="M23.3 7.6 Q24 8.3 24.7 7.6" stroke="rgba(0,0,0,.5)" stroke-width="0.5" fill="none" stroke-linecap="round" />
        </g>
      </svg>
      <span class="speech-bubble">Click me!</span>
    </button>
    <div class="title">타건 소리</div>
  </div>

  <div class="panel">
    <div class="card">
      <div class="now-playing">
        <div class="title" id="now-playing-title">사운드팩을 골라주세요</div>
        <div class="caption" id="now-playing-caption"></div>
      </div>
      <hr class="hr" />
      <div class="dropdown-wrap">
        <button id="dropdown-trigger" class="dropdown-trigger">
          <span id="dropdown-trigger-label">사운드팩 선택</span>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div id="dropdown-panel" class="dropdown-panel">
          <div id="dropdown-list" class="dropdown-list"></div>
        </div>
      </div>
      <hr class="hr" />
      <div class="action-bar">
        <button id="random-btn">무작위로 고르기</button>
        <div class="action-divider"></div>
        <button id="fav-btn">즐겨찾기에 추가</button>
      </div>
    </div>

    <div id="error-message" class="error"></div>

    <div class="card sliders-card">
      <div class="slider-row">
        <div class="slabel"><span>키보드 소리 볼륨</span><span class="val" id="volume-val">80</span></div>
        <input id="volume-slider" type="range" min="0" max="1" step="0.01" value="0.8" />
      </div>
      <div class="slider-row">
        <div class="slabel"><span>톤</span><span class="val" id="tone-val">50</span></div>
        <input id="tone-slider" type="range" min="0" max="1" step="0.01" value="0.5" />
      </div>
      <div class="slider-row">
        <div class="slabel"><span>반응 속도</span><span class="val" id="speed-val">100</span></div>
        <input id="speed-slider" type="range" min="0" max="1" step="0.01" value="1" />
      </div>
    </div>

    <div class="card darkmode-card">
      <span class="label">다크 모드</span>
      <label class="toggle">
        <input id="dark-toggle" type="checkbox" />
        <span class="track"></span>
        <span class="thumb"></span>
      </label>
    </div>

    <div class="card">
      <button id="prefs-header" class="prefs-header">
        <span>환경설정</span>
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
      </button>
      <div id="prefs-content" class="prefs-content">
        <div class="prefs-body">
          <hr class="hr" />
          <div>
            <div class="prefs-group-label">배경 색상</div>
            <div id="bg-swatches" class="swatch-row"></div>
          </div>
          <div>
            <div class="prefs-group-label">글꼴</div>
            <div id="font-pills" class="swatch-row"></div>
          </div>
          <div>
            <div class="prefs-group-label">글씨 색상</div>
            <div id="text-swatches" class="swatch-row"></div>
          </div>
        </div>
      </div>
    </div>

    <button id="ad-banner-btn" class="card ad-banner">
      <span class="ad-badge">AD</span>
      <span class="ad-copy">완소 키보드 — 타건감 끝판왕<span class="ad-sub">지금 이 소리, 이 키보드에서 납니다</span></span>
      <span class="ad-cta">보러가기 →</span>
    </button>
    <div class="ad-disclosure">이 포스팅은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</div>

    <button id="ad-inquiry-btn" class="credit-btn">광고주 모집 중입니다</button>
  </div>

  <div id="qr-modal-overlay" class="qr-modal-overlay">
    <div class="qr-modal">
      <img src="assets/kakaopay-qr.jpg" alt="카카오페이 송금 QR" />
      <div class="qr-caption">2000원으로 커피값을 선물해주세요! ☕<br />폰 카메라로 QR을 스캔하면 금액이 자동으로 입력돼요 🐱</div>
      <button id="qr-modal-close" class="qr-close">닫기</button>
    </div>
  </div>

  <script src="settings.js"></script>
</body>
</html>
